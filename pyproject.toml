[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-reconstruction-mvp"
version = "0.1.0"
description = "A small standalone map-image generation MVP"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["generate_map"]
